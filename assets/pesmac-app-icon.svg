  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="211" fill="none" stroke="#40e6ff" stroke-opacity=".32" stroke-width="4"/>
  <circle cx="256" cy="256" r="194" fill="none" stroke="#ff45e6" stroke-opacity=".18" stroke-width="3"/>
  <image href="./pesmac-logo.svg" x="50" y="86" width="412" height="309" preserveAspectRatio="xMidYMid meet" filter="url(#glow)"/>
